# Hexo site configuration
title: RDS666 的博客
subtitle: 记录技术、思考与日常
description: RDS666 的个人博客，分享技术实践、学习笔记与生活思考。
keywords:
  - 技术博客
  - 编程
  - 学习笔记
author: RDS666
language: zh-CN
timezone: Asia/Shanghai

url: https://rds666.github.io/Myblog
root: /Myblog/
permalink: posts/:year/:month/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 8
  order_by: -date
default_category: 随笔
category_map:
tag_map:
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 10
pagination_dir: page
include:
exclude:
ignore:

theme: butterfly

search:
  path: search.xml
  field: post
  content: true
  format: html

feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
  order_by: -date

sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

deploy:
  type: ''

menu:
  首页: / || fas fa-house
  归档: /archives/ || fas fa-box-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

favicon: /img/favicon.svg

avatar:
  img: /img/avatar.svg
  effect: true

disable_top_img: false
default_top_img: /img/cover-home.svg
index_img: /img/cover-home.svg
archive_img: /img/cover-archive.svg
tag_img: /img/cover-archive.svg
category_img: /img/cover-archive.svg
footer_img: false

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/post-1.svg
    - /img/post-2.svg
    - /img/post-3.svg

social:
  fab fa-github: https://github.com/RDS666 || GitHub || '#24292e'
  fas fa-envelope: 941411682@qq.com || Email || '#4a7dbe'

subtitle:
  enable: true
  effect: true
  sub:
    - 记录代码、灵感与日常
    - Build in public, learn in public
    - 用 Hexo 和 GitHub Pages 搭一座自己的小站

index_layout: 3
index_post_content:
  method: 2
  length: 160

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  custom_text: Powered by Hexo + Butterfly

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 一个关于代码、产品和生活的个人角落。
    button:
      enable: true
      icon: fab fa-github
      text: My GitHub
      link: https://github.com/RDS666
  card_announcement:
    enable: true
    content: 欢迎来到我的博客，这里会持续更新项目记录、学习笔记和生活随想。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 30
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2026-04-08 00:00:00

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: false

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 120

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 2
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 8
